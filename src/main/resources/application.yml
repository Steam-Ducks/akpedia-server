spring:
  application:
    name: akpedia-server

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/akpedia}
    username: ${DB_USER:akpedia}
    password: ${DB_PASSWORD:akpedia}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      # Acompanha o limite do serviço de embeddings (25 MiB): recusar antes aqui evita
      # subir o arquivo inteiro para ele devolver 413.
      max-file-size: 25MB
      max-request-size: 25MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

akpedia:
  embedding:
    base-url: ${EMBEDDING_BASE_URL:http://localhost:8000}
    connect-timeout: ${EMBEDDING_CONNECT_TIMEOUT:2s}
    read-timeout: ${EMBEDDING_READ_TIMEOUT:30s}

springdoc:
  swagger-ui:
    # /swagger-ui.html redireciona para cá; deixar explícito evita surpresa se o default mudar.
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
