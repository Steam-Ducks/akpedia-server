spring:
  application:
    name: akpedia-server

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/akpedia}
    username: ${DB_USER:akpedia}
    password: ${DB_PASSWORD:akpedia}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
