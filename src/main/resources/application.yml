spring:
  application:
    name: akpedia-server

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/akpedia}
    username: ${DB_USER:akpedia}
    password: ${DB_PASSWORD:akpedia}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      # Matches the embedding service's own limit (25 MiB): refusing here first
      # avoids uploading the whole file only for it to answer 413.
      max-file-size: 25MB
      max-request-size: 25MB

  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens are issued by the akpedia realm. The issuer is the public URL the browser logs in
          # at; the keys are fetched from wherever this server reaches Keycloak, which is not
          # localhost inside a container (KEYCLOAK_JWK_SET_URI).
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost/auth/realms/akpedia}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost/auth/realms/akpedia/protocol/openid-connect/certs}
          # Only tokens meant for this API: akpedia-client puts akpedia-server in their aud.
          audiences: akpedia-server

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
      # Redis only carries the processing stream; the JPA repositories are not Redis ones.
      repositories:
        enabled: false

server:
  port: ${SERVER_PORT:8080}

akpedia:
  embedding:
    base-url: ${EMBEDDING_BASE_URL:http://localhost:8000}
    connect-timeout: ${EMBEDDING_CONNECT_TIMEOUT:2s}
    read-timeout: ${EMBEDDING_READ_TIMEOUT:30s}
  search:
    default-limit: ${SEARCH_DEFAULT_LIMIT:10}
    max-limit: ${SEARCH_MAX_LIMIT:50}
    minimum-score: ${SEARCH_MINIMUM_SCORE:0.85}
    # Length agreed for the excerpt a result carries, ellipsis included.
    snippet-length: ${SEARCH_SNIPPET_LENGTH:300}
  internal:
    # Shared secret the akpedia-ml worker sends as X-Internal-Token on the /internal routes; the
    # same value as its INTERNAL_API_TOKEN. Left empty, every /internal call answers 401.
    token: ${INTERNAL_API_TOKEN:}
  processing:
    # Redis stream an approved document's id is added to, and the consumer group the
    # akpedia-ml workers read it with. Both must match the worker's DOCUMENTS_STREAM and
    # WORKER_GROUP.
    stream: ${DOCUMENTS_STREAM:documents:processing}
    group: ${WORKER_GROUP:ml-workers}
    # Approved documents never enqueued (process died, or Redis was down, right after the
    # approval) are looked for this often and sent again, once they are older than the grace.
    retry-interval: ${PROCESSING_RETRY_INTERVAL:30s}
    retry-grace: ${PROCESSING_RETRY_GRACE:1m}
    retry-batch-size: ${PROCESSING_RETRY_BATCH_SIZE:50}
  keycloak:
    # The Admin API, for the admin's users screen, through the akpedia-server client's service
    # account. Inside a container, Keycloak is reached by its container name, not localhost.
    admin:
      base-url: ${KEYCLOAK_ADMIN_BASE_URL:http://localhost/auth}
      realm: ${KEYCLOAK_REALM:akpedia}
      client-id: ${KEYCLOAK_SERVER_CLIENT_ID:akpedia-server}
      client-secret: ${KEYCLOAK_SERVER_CLIENT_SECRET:akpedia-dev-server-secret}
  account-deletion:
    # Every deleted account, one JSON line each (ids only, kept forever). Outside the database on
    # purpose: a restored backup brings deleted accounts back, and this file deletes them again.
    # Keep it out of the database backups.
    log-file: ${ACCOUNT_DELETION_LOG_FILE:./data/account-deletions.jsonl}
    # Replays the file on every start, in the background, retrying while Keycloak comes up.
    replay-on-startup: ${ACCOUNT_DELETION_REPLAY_ON_STARTUP:true}
    replay-retry-delay: ${ACCOUNT_DELETION_REPLAY_RETRY_DELAY:15s}
  gotenberg:
    base-url: ${GOTENBERG_BASE_URL:http://localhost:3000}
    connect-timeout: ${GOTENBERG_CONNECT_TIMEOUT:5s}
    read-timeout: ${GOTENBERG_READ_TIMEOUT:90s}

springdoc:
  swagger-ui:
    # /swagger-ui.html redirects here; explicit so a changed default cannot surprise us.
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
