name: CI

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  REVIEW_TEAM: ${{ vars.REVIEW_TEAM || 'developers' }}

jobs:
  # ---------------------------------
  # 1. Padrão de branch e de commits
  # ---------------------------------
  validate:
    name: Padrão de branch & commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar nome da branch (AKP-<número>)
        run: |
          BRANCH="${{ github.head_ref }}"
          echo "Branch de origem: $BRANCH"
          if [[ ! "$BRANCH" =~ ^AKP-[0-9]+$ ]]; then
            echo "::error::Nome de branch inválido: '$BRANCH'. Use o padrão AKP-<número>, ex.: AKP-12."
            exit 1
          fi
          echo "OK: nome de branch dentro do padrão."

      - name: Validar mensagens de commit (Conventional Commits + escopo AKP-<número>)
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          # type(AKP-<número>)!: descrição
          REGEX='^(feat|fix|docs|chore|refactor|test|style|perf|build|ci|revert)\(AKP-[0-9]+\)(!)?: .+'
          FAIL=0
          while read -r SHA; do
            MSG=$(git log -1 --format=%s "$SHA")
            # Ignora commits de merge
            if [[ "$MSG" =~ ^Merge ]]; then
              echo "skip (merge): $MSG"
              continue
            fi
            if [[ ! "$MSG" =~ $REGEX ]]; then
              echo "::error::Commit fora do padrão: '$MSG'"
              FAIL=1
            else
              echo "OK: $MSG"
            fi
          done < <(git rev-list "$BASE".."$HEAD")
          if [[ "$FAIL" -ne 0 ]]; then
            echo "::error::Padrão esperado: type(AKP-<número>): descrição  (ex.: feat(AKP-12): adiciona endpoint de login)"
            exit 1
          fi
          echo "OK: todos os commits dentro do padrão."

  # ---------------------------------------------------------------------------
  # 2. Detecta se houve mudança em src/** (features). Config/build ficam de fora.
  # ---------------------------------------------------------------------------
  changes:
    name: Detectar mudanças em src
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filtro de caminhos
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            src:
              - 'src/**'

  # --------------------------------------------------------------------
  # 3. Lint de Java (Checkstyle) (apenas quando src/** tiver alterações)
  # --------------------------------------------------------------------
  lint:
    name: Lint Java (Checkstyle)
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Tornar o mvnw executável
        run: chmod +x ./mvnw

      - name: Rodar Checkstyle
        run: |
          ./mvnw -B -ntp \
            org.apache.maven.plugins:maven-checkstyle-plugin:3.6.0:check \
            -Dcheckstyle.config.location=config/checkstyle/checkstyle.xml \
            -Dcheckstyle.includeTestSourceDirectory=true \
            -Dcheckstyle.failOnViolation=true

  # --------------------------------------------------------------
  # 4. Testes de qualidade (apenas quando src/** tiver alterações)
  # --------------------------------------------------------------
  quality:
    name: Testes de qualidade
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: akpedia
          POSTGRES_USER: akpedia
          POSTGRES_PASSWORD: akpedia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U akpedia -d akpedia"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: jdbc:postgresql://localhost:5432/akpedia
      DB_USER: akpedia
      DB_PASSWORD: akpedia
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Tornar o mvnw executável
        run: chmod +x ./mvnw

      - name: Rodar testes
        run: ./mvnw -B -ntp test

  # -------------------------------------------------------------------
  # 5. Após todo o workflow passar, solicita revisão de um time da org
  # -------------------------------------------------------------------
  request-review:
    name: Solicitar aprovação da equipe
    needs: [validate, lint, quality]
    # Roda se nada falhou/cancelou — lint/quality podem ter sido pulados
    # (mudança só em config/build), o que não deve bloquear a solicitação.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Solicitar review do time ${{ env.REVIEW_TEAM }}
        uses: actions/github-script@v7
        with:
          script: |
            const team = process.env.REVIEW_TEAM;
            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                team_reviewers: [team],
              });
              core.info(`Revisão solicitada ao time: ${team}`);
            } catch (error) {
              if (error.status === 422) {
                core.info(`Revisão já solicitada ou time indisponível (${team}). Seguindo.`);
              } else {
                core.setFailed(`Falha ao solicitar revisão: ${error.message}`);
              }
            }
