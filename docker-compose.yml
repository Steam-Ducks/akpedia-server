services:
  db:
    image: pgvector/pgvector:pg16
    container_name: akpedia-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-akpedia}
      POSTGRES_USER: ${POSTGRES_USER:-akpedia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-akpedia}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-akpedia} -d ${POSTGRES_DB:-akpedia}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Streams carry the document processing queue between the server (producer)
  # and the akpedia-ml worker (consumer). It also joins akpedia-net, the network the
  # akpedia-ml compose attaches to, so the worker reaches it as akpedia-redis.
  redis:
    image: redis:7-alpine
    container_name: akpedia-redis
    # AOF on, so the queue of approved documents survives a restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default
      - akpedia-net

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: akpedia-gotenberg
    ports:
      - "3000:3000"

  app:
    build: .
    container_name: akpedia-app
    depends_on:
      db:
        condition: service_healthy
      gotenberg:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-akpedia}
      DB_USER: ${POSTGRES_USER:-akpedia}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-akpedia}
      SERVER_PORT: 8080
      # Default user, temporary while there is no registration or login.
      DEFAULT_USER_EMAIL: ${DEFAULT_USER_EMAIL:-aprovador@akpedia.local}
      # Embedding service (akpedia-ml). It comes up through its own repository's
      # compose, on a separate network: host-gateway reaches the port it publishes
      # on the developer's machine.
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:8000}
      EMBEDDING_CONNECT_TIMEOUT: ${EMBEDDING_CONNECT_TIMEOUT:-2s}
      EMBEDDING_READ_TIMEOUT: ${EMBEDDING_READ_TIMEOUT:-30s}
      # Gotenberg (document to PDF conversion). Comes up as the sibling service above,
      # reached by its service name on the compose network.
      GOTENBERG_BASE_URL: ${GOTENBERG_BASE_URL:-http://gotenberg:3000}
      GOTENBERG_CONNECT_TIMEOUT: ${GOTENBERG_CONNECT_TIMEOUT:-5s}
      GOTENBERG_READ_TIMEOUT: ${GOTENBERG_READ_TIMEOUT:-90s}
      # Redis (document processing queue). Sibling service above, reached by service name.
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Shared secret of the /internal routes; the akpedia-ml compose falls back to the same
      # development value, so the worker can call back with no .env on either side.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-akpedia-dev-internal-token}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:

networks:
  # Shared with the akpedia-ml compose, which declares it as external. Created here,
  # with a fixed name, because this compose owns Redis: bring it up first.
  akpedia-net:
    name: akpedia-net
