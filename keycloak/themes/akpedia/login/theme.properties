# Akpedia's look on Keycloak's login pages (login, errors, password reset, required actions).
# Inherits templates and behavior from keycloak.v2; only styles are overridden.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/akpedia.css
# The app has no dark mode, so the login pages stay light as well.
darkMode=false
